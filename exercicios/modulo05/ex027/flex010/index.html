<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>
    <style>
        div.container {
            background-color: gold;

            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 300px;
            flex-shrink: 1; /* PROPRIEDADE QUE ENCOLHE A WIDTH CONFORME DIMINUI A PAGINA */
            flex-grow: 1; /* AUMENTA A WIDTH CONFORME A PAGINA É AUMENTADA */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
    </div>
</body>
</html>
