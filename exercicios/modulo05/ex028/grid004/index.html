<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na Pratica</title>
    <style>
        div.container {
            border: 3px dashed blue;

            display: grid;
            grid-template-rows: repeat(3, 80px);
            grid-template-columns: 1fr 4fr 1fr; /* GRID É DIVIDIDO EM 6 EM QUE O SEGUNDO É 4VEZES MAIOR */
            grid-auto-flow: row; /* GRID ITEM CRIADO NA LINHA  */
            grid-auto-rows: 80px; /* DEFINE O TAMANHO DOS NOVOS GRID ITEMS CRIADOS NA LINHA */
            grid-auto-columns: 120px;
            gap: 10px;
            place-items: normal normal; /* ALIGN AND JUSTIFY */
            place-content: normal normal;                   
        }

        div.item {
            border: 3px dashed red;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
        <div class="item">J</div>
    </div>
</body>
</html>
